# Builds the Android app (signed APK) and offers it as a download on the run page.
# Started by hand with "publish", it also puts the APK into the repository
# (release/Vokabeltrainer-<version>.apk) and creates a GitHub release with the APK attached.
name: Android-APK

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'APK ins Repository legen und als Release veröffentlichen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Oberfläche bauen und ins Android-Projekt kopieren
        run: npm run android:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest brings the Android SDK (ANDROID_HOME is set).
      - name: APK bauen
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK benennen
        id: apk
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').version")
          mkdir -p out
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk "out/Vokabeltrainer-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Vokabeltrainer-${{ steps.apk.outputs.version }}-apk
          path: out/Vokabeltrainer-${{ steps.apk.outputs.version }}.apk
          if-no-files-found: error

      - name: APK ins Repository legen
        if: ${{ inputs.publish }}
        run: |
          mkdir -p release
          rm -f release/*.apk
          cp out/*.apk release/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release
          git commit -m "APK ${{ steps.apk.outputs.version }} gebaut" || echo "APK unverändert"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Release veröffentlichen
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          FILE="out/Vokabeltrainer-${{ steps.apk.outputs.version }}.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$(git rev-parse HEAD)" \
              --title "Vokabeltrainer ${{ steps.apk.outputs.version }}" \
              --notes "Android-App (APK) für den Vokabeltrainer. Herunterladen, auf dem Handy öffnen und die Installation erlauben."
          fi
